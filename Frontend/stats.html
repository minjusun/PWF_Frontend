<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale &amp; Dolphin Tracker stats</title>
<!--
  Each view is a copy of a card on the Streamlit dashboard (app.py):
    /stats/active-users   "Active users"                    number, "vs prev." badge, monthly chart
    /stats/sightings      "Animals counted"                 number, "vs prev." badge, monthly chart
    /stats/contributors   "Top 5 Contributors (Past Year)"  Rank, Boat, Sightings
    /stats                all three
  The single views fill the iframe they're placed in. Add ?theme=dark for a navy card.
  Numbers come from the "dashboard" block of the stats data (dashboard_stats.py), which map_api.py
  puts in window.__STATS__; otherwise they're fetched from /api/stats.json.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<!-- Plotly's small "basic" build (line charts only): same chart engine as the dashboard -->
<script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js"></script>
<style>
  /* Colours and sizes copied from the dashboard */
  :root {
    --bg: transparent; --card: #FFFFFF; --border: #DCE7EA; --line: #E3E9EC;
    --title: #12303B; --label: #5B7680; --value: #0E4D64; --tick: #0B2233;
    --grid: #EAF1F3; --axis: #DCE7EA; --teal: #1B7F8C; --fill: rgba(79,176,165,0.18);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #020714; --card: #0A1428; --border: #1C2A45; --line: #1C2A45;
    --title: #FFFFFF; --label: #9FB0C8; --value: #A5DDF7; --tick: #C9DAE7;
    --grid: #1C2A45; --axis: #3A4C6D; --teal: #4FB8A8; --fill: rgba(79,184,168,0.22);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { font-size: 14px; }
  html, body { margin: 0; background: var(--bg); color: var(--title); }
  body { font-family: "Source Sans 3", "Source Sans Pro", -apple-system, "Segoe UI", sans-serif; }

  .page { max-width: 1400px; margin: 0 auto; padding: 24px 20px 30px; }
  .page > h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 4px; }
  .page > .intro { color: var(--label); margin: 0 0 20px; max-width: 62ch; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .updated { color: var(--label); font-size: 0.82rem; margin-top: 16px; }

  /* Cards: same as [class*="st-key-card"] in app.py */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px 16px 14px; min-width: 0; display: flex; flex-direction: column; }
  .card.kpi { padding: 12px 16px 10px; }
  .card-title { font-size: 0.92rem; font-weight: 600; color: var(--title); padding: 0 0 10px; }
  .metric-label { font-size: 0.76rem; color: var(--label); margin: 0 0 4px; }
  .metric-value { font-size: 1.4rem; color: var(--value); line-height: 1.2; }
  .metric-delta { align-self: flex-start; display: inline-flex; gap: 4px; margin-top: 6px; padding: 1px 7px;
                  border-radius: 999px; font-size: 0.72rem; }
  .metric-delta.up { color: rgb(9,171,59); background: rgba(9,171,59,0.1); }
  .metric-delta.down { color: rgb(255,43,43); background: rgba(255,43,43,0.1); }
  .chart { width: 100%; height: 135px; margin-top: 8px; }

  /* Top 5 contributors: same as .ctab in app.py */
  .ctab { width: 100%; border-collapse: collapse; font-size: 0.86rem; color: var(--title); }
  .ctab th { text-align: left; font-weight: 500; color: var(--label); padding: 6px 8px 8px; border-bottom: 1px solid var(--line); }
  .ctab td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .ctab tr:last-child td { border-bottom: none; }
  .ctab th.num, .ctab td.num { text-align: right; }
  .ctab th.rk, .ctab td.rk { width: 42px; color: var(--label); }
  .status { color: var(--label); font-size: 0.86rem; padding: 8px 0; }

  /* Single-chart embeds fill the iframe: the card takes the whole box, the chart takes what's left */
  body.embed .page { padding: 0; max-width: none; }
  body.embed .page > h1, body.embed .page > .intro, body.embed .updated { display: none; }
  html:has(body.embed), body.embed { height: 100%; overflow: hidden; }
  body.embed .page, body.embed .grid { height: 100%; }
  body.embed .grid { display: block; }
  body.embed .card { height: 100%; border-radius: 0; border: 0; }
  body.embed .chart { flex: 1 1 0; height: auto; min-height: 110px; }
</style>
</head>
<body>
<main class="page">
  <h1>Whale &amp; Dolphin Tracker</h1>
  <p class="intro">Live numbers from sightings recorded by our community of whale watchers. Updated every hour.</p>
  <div class="grid">
    <section class="card kpi" id="active-users" aria-label="Active users"><div class="status">Loading…</div></section>
    <section class="card kpi" id="sightings" aria-label="Animals counted"><div class="status">Loading…</div></section>
    <section class="card" id="contributors" aria-label="Top 5 contributors"><div class="status">Loading…</div></section>
  </div>
  <p class="updated" id="updated"></p>
</main>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

  // /stats/active-users, /stats/sightings or /stats/contributors show just that card
  const VIEWS = ['active-users', 'sightings', 'contributors'];
  const view = VIEWS.find(v => location.pathname.replace(/\/+$/, '').endsWith('/stats/' + v));
  if (view) {
    document.body.classList.add('embed');
    VIEWS.filter(v => v !== view).forEach(v => document.getElementById(v).remove());
  }

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const fmt = n => Number(n || 0).toLocaleString('en-US');
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const FONT = '-apple-system, Segoe UI, Inter, sans-serif';

  function setBody(id, html) {
    const card = document.getElementById(id);
    if (!card) return null;
    card.innerHTML = html;
    return card;
  }

  // Same chart as sparkline(..., h=135, axes=True) in app.py
  function drawSparkline(el, monthly, yTitle) {
    const tick = { size: 11, color: css('--tick') };
    const title = t => ({ text: t, font: { size: 11, color: css('--tick') }, standoff: 12 });
    const embed = document.body.classList.contains('embed');
    Plotly.newPlot(el, [{
      x: monthly.map(p => p.month), y: monthly.map(p => p.value),
      type: 'scatter', mode: 'lines', fill: 'tozeroy',
      line: { color: css('--teal'), width: 2 }, fillcolor: css('--fill'),
      hovertemplate: '%{x|%b %Y}: %{y:,.0f}<extra></extra>',
    }], {
      ...(embed ? { autosize: true } : { height: 135 }),
      margin: { l: 52, r: 10, t: 6, b: 42 }, showlegend: false,
      paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
      font: { family: FONT, size: 10, color: css('--tick') },
      hoverlabel: { bgcolor: 'white' },
      xaxis: { showgrid: false, linecolor: css('--axis'), tickformat: '%b %y', nticks: 7, tickfont: tick,
               title: title('Month'), automargin: true, fixedrange: true },
      yaxis: { rangemode: 'tozero', gridcolor: css('--grid'), nticks: 4, zeroline: false, tickfont: tick,
               title: title(yTitle), automargin: true, fixedrange: true },
    }, { displayModeBar: false, responsive: true });
  }

  function renderKpi(id, label, block, yTitle) {
    const d = block.delta;
    const card = setBody(id,
      `<div class="metric-label">${esc(label)}</div>` +
      `<div class="metric-value">${fmt(block.value)}</div>` +
      (d ? `<div class="metric-delta ${d.up ? 'up' : 'down'}">${d.up ? '↑' : '↓'} ${esc(d.text)}</div>` : '') +
      `<div class="chart" role="img" aria-label="${esc(label)} per month"></div>`);
    if (card) drawSparkline(card.querySelector('.chart'), block.monthly || [], yTitle);
  }

  function renderContributors(rows) {
    const body = rows.length
      ? rows.map(r => `<tr><td class="rk">${r.rank}</td><td>${esc(r.boat)}</td><td class="num">${fmt(r.sightings)}</td></tr>`).join('')
      : '<tr><td colspan="3">No sightings in the past year.</td></tr>';
    setBody('contributors',
      '<div class="card-title">Top 5 Contributors (Past Year)</div>' +
      '<table class="ctab"><thead><tr><th class="rk">Rank</th><th>Boat</th><th class="num">Sightings</th></tr></thead>' +
      `<tbody>${body}</tbody></table>`);
  }

  function showMessage(msg) {
    VIEWS.forEach(v => setBody(v, `<p class="status">${esc(msg)}</p>`));
  }

  async function load(attempt = 1) {
    let data;
    try {
      data = window.__STATS__;                 // filled in by the server, so no extra request
      if (!data) {
        const res = await fetch('/api/stats.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(res.status);
        data = await res.json();
      }
    } catch (e) {
      // A free Render server can take up to a minute to wake up
      if (attempt < 4) { showMessage('The stats server is starting up. Trying again in a few seconds…');
                         setTimeout(() => load(attempt + 1), 15000); }
      else showMessage('Couldn’t load the stats. Reload the page to try again.');
      return;
    }
    const dash = data && data.dashboard;
    if (!dash) { showMessage('These charts need a newer data snapshot. Run: python map_api.py --refresh-snapshot'); return; }
    renderKpi('active-users', 'Active users', dash.active_users, 'Users');
    renderKpi('sightings', 'Animals counted', dash.animals, 'Animals');
    renderContributors(dash.contributors || []);
    if (data.updated) {
      document.getElementById('updated').textContent = 'Last updated ' +
        new Date(data.updated).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
    }
  }
  load();
})();
</script>
</body>
</html>
