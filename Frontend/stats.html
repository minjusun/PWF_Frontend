<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale & dolphin sightings stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* White and light blue by default; add ?theme=dark for the map's navy */
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --line: #e1ecf4;
    --axis: #b9c9d8;
    --text: #0b2236;
    --muted: #0b2236;      /* same as --text: all text one colour */
    --accent: #a5ddf7;
    --accent-ink: #2a87b8;
    --whales: #a5ddf7;
    --dolphins: #4a9fd0;
    --unknown: #d3dde6;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #020714;
    --panel: #0a1428;
    --line: #1c2a45;
    --axis: #3a4c6d;
    --text: #ffffff;
    --muted: #ffffff;      /* same as --text: all text one colour */
    --accent: #a5ddf7;
    --accent-ink: #a5ddf7;
    --whales: #a5ddf7;
    --dolphins: #4fb8a8;
    --unknown: #7d8aa3;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.55 "Open Sans", "Helvetica Neue", Arial, sans-serif; }
  /* Big numbers: the same font as the text, just heavier */
  .num { font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  /* Titles: the same regular font as the text */
  h1, h2 { font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif; font-weight: 600; letter-spacing: 0; color: var(--text); }

  .page { max-width: 1100px; margin: 0 auto; padding: 32px 20px 40px; }
  .page > h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0 0 6px; }
  .page > .intro { color: var(--muted); margin: 0 0 28px; max-width: 62ch; }
  .grid { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
  .grid #sightings { grid-column: 1 / -1; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px 18px; min-width: 0; }
  /* Chart titles: same size, font and colour on every chart */
  .panel h2, body.embed .panel h2 { font-size: 20px; line-height: 1.2; margin: 0 0 12px; }
  .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

  /* Single-chart embeds fill the iframe with no page chrome */
  body.embed .page { padding: 0; max-width: none; }
  body.embed .page > h1, body.embed .page > .intro, body.embed .updated { display: none; }
  body.embed .grid { display: block; }
  /* Each chart fits whatever box the iframe gives it (a square works well) */
  html:has(body.embed), body.embed { height: 100%; overflow: hidden; }
  body.embed .page, body.embed .grid { height: 100%; }
  body.embed .panel { border-radius: 0; border: 0; height: 100%; display: flex; flex-direction: column;
                      padding: clamp(14px, 4vmin, 22px); }
  body.embed .chart, body.embed #sightings .chart { flex: 1 1 0; height: auto; min-height: 110px; overflow: hidden; }
  body.embed .headline .num { font-size: inherit; }
  body.embed .facts { margin: clamp(6px, 2vmin, 12px) 0 clamp(8px, 3vmin, 16px); }
  body.embed .note { margin-top: 8px; }
  body.embed ol.leaders { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: flex-start; }
  body.embed ol.leaders li { padding: 8px 0; }
  body.embed .status { flex: 1; }

  /* Active users */
  .headline { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
  .headline .num { font-size: inherit; line-height: inherit; color: var(--text); font-weight: 600; letter-spacing: 0; }
  .headline .label { color: var(--muted); }
  .headline .also { margin-left: 28px; }            /* space between the two numbers */
  .headline { margin-bottom: 14px; }
  .facts { display: flex; gap: 28px; margin: 12px 0 16px; flex-wrap: wrap; }
  .facts div { color: var(--text); font-size: 15px; }
  .facts strong { display: inline; color: var(--text); font-size: inherit; font-weight: 600; margin-right: 4px; }
  .chart { height: 170px; }
  #sightings .chart { height: 240px; }

  /* Sightings */
  .bar-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .totals { color: var(--muted); margin: -6px 0 14px; }
  .totals strong { color: var(--text); font-weight: 600; }
  /* Plain HTML bar chart with a y-axis, gridlines and x labels (nothing extra to download) */
  .plot { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto auto; height: 100%; min-height: 0; column-gap: 6px; }
  .plot .ytitle { grid-column: 1 / 3; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .plot .yaxis { position: relative; min-width: 24px; }
  .plot .yaxis span { position: absolute; right: 0; transform: translateY(50%); font-size: 11px; color: var(--muted); line-height: 1; white-space: nowrap; }
  .plot .area { position: relative; border-left: 1px solid var(--axis); border-bottom: 1px solid var(--axis); min-height: 0; }
  .plot .grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
  .bars { position: absolute; inset: 0 2px 0 3px; display: flex; align-items: flex-end; gap: 3px; }
  .bars .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; }
  .bars .stack { width: 100%; display: flex; flex-direction: column-reverse; border-radius: 2px 2px 0 0; overflow: hidden; }
  .bars .stack i { display: block; }
  .plot .xlabels { grid-column: 2; display: flex; gap: 3px; padding: 0 2px 0 3px; margin-top: 4px; }
  .plot .xlabels span { flex: 1 1 0; min-width: 0; text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: visible; }
  .plot .xlabels.years span { font-size: 10px; }
  .plot .xtitle { grid-column: 2; text-align: center; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .chart { display: flex; flex-direction: column; }
  .legend { display: flex; gap: 6px 18px; flex-wrap: wrap; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; background: var(--c); vertical-align: -1px; }
  .legend b { color: var(--text); font-weight: 600; }

  /* Contributors */
  ol.leaders { list-style: none; margin: 0; padding: 0; counter-reset: rank; }
  ol.leaders li { counter-increment: rank; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 3px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  ol.leaders li:first-child { border-top: 0; padding-top: 2px; }
  ol.leaders li::before { content: counter(rank); font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 15px; line-height: 1; color: var(--text); grid-row: span 2; }
  .who { font-weight: 600; overflow-wrap: anywhere; }
  .count { font-weight: 600; text-align: right; white-space: nowrap; }
  .meter { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .sub { grid-column: 2 / 4; color: var(--muted); font-size: 13px; }

  /* Hover tooltip on bars (Active users) */
  .tip { position: fixed; z-index: 10; pointer-events: none; white-space: pre; line-height: 1.5;
         background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
         padding: 5px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
         opacity: 0; transition: opacity .12s; }
  .tip.show { opacity: 1; }
  .tip b { font-weight: 600; }
  .bars .col[data-tip] { cursor: default; }
  .bars .col[data-tip]:hover .stack { filter: brightness(0.9); }
  .status { color: var(--muted); padding: 24px 0; }
  .updated { color: var(--muted); font-size: 13px; margin-top: 22px; }
  button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
  .toggle button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--accent); color: var(--text); font-weight: 600; }
  .bar-head { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin: -4px 0 12px; }
  .bar-head .totals { margin: 0; }

  /* ── Single-chart embeds (/stats/active-users, /stats/sightings, /stats/contributors) ──
     Bigger text everywhere, because websites usually show these iframes scaled down.
     Change EMBED sizes here; the full /stats page keeps the normal sizes above. */
  body.embed { font-size: 20px; }                                   /* base text, "16 active so far…" */
  body.embed .panel h2 { font-size: 28px; margin-bottom: 14px; }   /* chart titles */
  body.embed .note, body.embed .legend, body.embed .sub,
  body.embed .toggle button { font-size: 17px; }                    /* notes, legend, boat details, buttons */
  body.embed .plot .yaxis span, body.embed .plot .xlabels span,
  body.embed .plot .ytitle, body.embed .plot .xtitle { font-size: 15px; }   /* axis numbers and titles */
  body.embed .plot .xlabels.years span { font-size: 14px; }         /* year labels (many of them) */
  body.embed .plot .yaxis { min-width: 34px; }                      /* room for the bigger axis numbers */
  body.embed ol.leaders li::before { font-size: 20px; }             /* rank numbers 1–5 */
  body.embed ol.leaders li { grid-template-columns: 40px 1fr auto; }
  body.embed .tip { font-size: 15px; }                              /* hover labels */
</style>
</head>
<body>
<main class="page">
  <h1>Whale and dolphin sightings</h1>
  <p class="intro">Live numbers from sightings recorded by our community of whale watchers. Updated every hour.</p>

  <div class="grid">
    <section class="panel" id="active-users" aria-labelledby="au-title">
      <h2 id="au-title">Active users</h2>
      <div class="status">Loading…</div>
    </section>

    <section class="panel" id="contributors" aria-labelledby="tc-title">
      <h2 id="tc-title">Top 5 contributors (all time)</h2>
      <div class="status">Loading…</div>
    </section>

    <section class="panel" id="sightings" aria-labelledby="sg-title">
      <h2 id="sg-title">Animals counted</h2>
      <div class="status">Loading…</div>
    </section>
  </div>

  <p class="updated" id="updated"></p>
</main>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

  // /stats/active-users, /stats/sightings or /stats/contributors show just that panel
  const VIEWS = ['active-users', 'sightings', 'contributors'];
  const view = VIEWS.find(v => location.pathname.replace(/\/+$/, '').endsWith('/stats/' + v));
  if (view) {
    document.body.classList.add('embed');
    VIEWS.filter(v => v !== view).forEach(v => document.getElementById(v).remove());
  }

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const fmt = n => Number(n).toLocaleString('en-US');
  const GROUPS = [
    { key: 'Whales', label: 'Whales', color: '--whales' },
    { key: 'Dolphins', label: 'Dolphins & porpoises', color: '--dolphins' },
    { key: 'Unknown', label: 'Unknown', color: '--unknown' },
  ];
  const monthLabel = p => {
    const [y, m] = p.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-US', { month: 'short', timeZone: 'UTC' });
  };
  const monthLong = p => {
    const [y, m] = p.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  };

  // A round top for the y-axis (e.g. 37 -> 40, 1,830 -> 2,000) with 4 even steps.
  function niceScale(max) {
    if (max <= 0) return { top: 4, step: 1 };
    const raw = max / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => st >= raw);
    const s = Math.max(1, step);
    const st = max < 4 ? 1 : s;                       // small counts: whole numbers only
    return { top: Math.ceil(max / st) * st, step: st };
  }
  const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
  const tickText = v => v >= 10000 ? compact.format(v) : fmt(v);

  // Bar chart with a labeled y-axis. Each column is a stack of colored pieces.
  function barsHtml(rows, keys, labelOf, titleOf, yTitle, xTitle, useTip) {
    const totals = rows.map(r => keys.reduce((t, k) => t + (r[k.key] || 0), 0));
    const { top, step } = niceScale(Math.max(...totals, 0));
    const ticks = [];
    for (let v = 0; v <= top + step / 2; v += step) ticks.push(v);
    const pct = v => (v / top * 100).toFixed(2) + '%';
    return `<div class="plot">
      <div class="ytitle">${yTitle}</div>
      <div class="yaxis" aria-hidden="true">${ticks.map(v => `<span style="bottom:${pct(v)}">${tickText(v)}</span>`).join('')}</div>
      <div class="area">
        ${ticks.slice(1).map(v => `<div class="grid" style="bottom:${pct(v)}"></div>`).join('')}
        <div class="bars">${rows.map((r, i) => `
          <div class="col" ${useTip ? 'data-tip' : 'title'}="${titleOf(r, totals[i])}">
            <div class="stack" style="height:${pct(totals[i])}">
              ${keys.map(k => r[k.key] ? `<i style="flex:${r[k.key]};background:var(${k.color})"></i>` : '').join('')}
            </div>
          </div>`).join('')}</div>
      </div>
      <div class="xlabels" aria-hidden="true">${rows.map((r, i) => `<span>${labelOf(r, i)}</span>`).join('')}</div>
      <div class="xtitle">${xTitle}</div>
    </div>`;
  }

  function setBody(id, html) {
    const panel = document.getElementById(id);
    if (!panel) return null;
    panel.querySelectorAll(':scope > :not(h2)').forEach(el => el.remove());
    panel.insertAdjacentHTML('beforeend', html);
    return panel;
  }

  function renderActiveUsers(a) {
    const thisMonth = a.monthly[a.monthly.length - 1];
    const monthName = p => monthLong(p).split(' ')[0];
    // January to December of the current year. The last-12-months data always covers every month
    // of this year so far; months still to come are shown as empty bars.
    const year = thisMonth.period.slice(0, 4);
    const byPeriod = Object.fromEntries(a.monthly.map(r => [r.period, r]));
    const months = Array.from({ length: 12 }, (_, i) => {
      const period = `${year}-${String(i + 1).padStart(2, '0')}`;
      const r = byPeriod[period];
      return r ? r : { period, users: 0, future: period > thisMonth.period };
    });
    const bars = barsHtml(months, [{ key: 'users', color: '--accent' }],
      r => monthLabel(r.period),
      r => r.future ? `${monthLong(r.period)}: no data yet`
                    : `${monthLong(r.period)}: ${fmt(r.users)} active user${r.users === 1 ? '' : 's'}`,
      'Active users', 'Month', true);
    setBody('active-users', `
      <div class="headline"><span class="num">${fmt(thisMonth.users)}</span>
        <span class="label">active so far in ${monthName(thisMonth.period)}</span>
        <span class="also"><span class="num">${fmt(a.all_time)}</span> contributors all time</span></div>
      <div class="chart" role="img" aria-label="Active users per month, January to December ${year}">${bars}</div>
      <p class="note">Active means they logged at least one trip or sighting that month.</p>`);
  }

  function renderSightings(s) {
    const legend = GROUPS.map(g => {
      const t = s.groups.find(x => x.group === g.key) || { animals: 0 };
      return `<span style="--c: var(${g.color})">${g.label} <b>${fmt(t.animals)}</b></span>`;
    }).join('');
    const panel = setBody('sightings', `
      <div class="bar-head">
        <p class="totals"><strong>${fmt(s.total_animals)}</strong> animals counted across
          <strong>${fmt(s.total_sightings)}</strong> sightings</p>
        <div class="toggle" role="group" aria-label="Time range">
          <button type="button" data-range="year" aria-pressed="true">By year</button>
          <button type="button" data-range="month" aria-pressed="false">Last 12 months</button>
        </div>
      </div>
      <div class="legend">${legend}</div>
      <div class="chart" role="img"></div>
      <p class="note"></p>`);
    if (!panel) return;
    const chart = panel.querySelector('.chart');
    const note = panel.querySelector('.note');

    function draw(range) {
      const byYear = range === 'year';
      const rows = byYear ? s.by_year : s.by_month;
      const label = r => byYear ? r.period : monthLabel(r.period);   // every year / month gets a label
      const title = (r, total) => `${byYear ? r.period : monthLong(r.period)}: ${fmt(total)} animals\n` +
        GROUPS.map(g => `${g.label}: ${fmt(r[g.key] || 0)}`).join('\n');
      chart.innerHTML = barsHtml(rows, GROUPS, label, title, 'Animals counted', byYear ? 'Year' : 'Month', true);
      chart.querySelector('.xlabels').classList.toggle('years', byYear);
      chart.setAttribute('aria-label', byYear ? 'Animals counted per year, by species group'
                                              : 'Animals counted per month, last 12 months, by species group');
      note.textContent = (byYear ? 'Per year. ' : 'Per month, last 12 months. ') +
        'Whales, dolphins and porpoises, plus sightings logged as unknown. Marine debris is not included.';
      panel.querySelectorAll('.toggle button').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.range === range)));
    }
    panel.querySelectorAll('.toggle button').forEach(b =>
      b.addEventListener('click', () => draw(b.dataset.range)));
    draw('year');
  }

  function renderContributors(list) {
    if (!list.length) { setBody('contributors', '<p class="status">No sightings yet.</p>'); return; }
    const max = Math.max(...list.map(c => c.sightings), 1);
    const esc = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    setBody('contributors', `<ol class="leaders">${list.map(c => `
      <li>
        <span class="who">${esc(c.name)}</span>
        <span class="count">${fmt(c.sightings)} sightings</span>
        <span class="meter"><i style="width:${(c.sightings / max * 100).toFixed(1)}%"></i></span>
        <span class="sub">${fmt(c.animals)} animals, ${fmt(c.species)} species, ${fmt(c.trips)} trips</span>
      </li>`).join('')}</ol>
      <p class="note">Ranked by whale and dolphin sightings logged, all time.</p>`);
  }

  function showError(retrying) {
    const msg = retrying ? 'The stats server is starting up. Trying again in a few seconds…'
                         : 'Couldn’t load the stats. Reload the page to try again.';
    VIEWS.forEach(v => setBody(v, `<p class="status">${msg}</p>`));
  }

  async function load(attempt = 1) {
    try {
      let data = window.__STATS__;              // filled in by the server, so no extra request
      if (!data) {
        const res = await fetch('/api/stats.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(res.status);
        data = await res.json();
      }
      renderActiveUsers(data.active_users);
      renderSightings(data.sightings);
      renderContributors(data.contributors);
      const when = new Date(data.updated);
      document.getElementById('updated').textContent =
        'Last updated ' + when.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
    } catch (e) {
      // A free Render server can take up to a minute to wake up
      if (attempt < 4) { showError(true); setTimeout(() => load(attempt + 1), 15000); }
      else showError(false);
    }
  }
  const tip = document.createElement('div');
  tip.className = 'tip';
  document.body.appendChild(tip);
  function placeTip(e, col) {
    tip.textContent = col.dataset.tip;
    tip.classList.add('show');
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX - w / 2, y = e.clientY - h - 12;
    x = Math.max(4, Math.min(x, innerWidth - w - 4));
    if (y < 4) y = e.clientY + 16;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  document.addEventListener('pointermove', e => {
    const col = e.target.closest && e.target.closest('.col[data-tip]');
    if (col) placeTip(e, col); else tip.classList.remove('show');
  });
  document.addEventListener('pointerleave', () => tip.classList.remove('show'));

  load();
})();
</script>
</body>
</html>
